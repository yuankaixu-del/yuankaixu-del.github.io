`工作顺序`,"Nothing waits for anything else.":`没有任何任务需要等待其他任务。`,"The longest chain of prerequisites has {n} rounds.":`最长的先后依赖链共有 {n} 轮。`,"Tasks in the same round do not wait for each other, so they can run side by side.":`同一轮中的任务无需互相等待，因此可以并行开展。`,"Round {n}":`第 {n} 轮`,"The thinking a person keeps":`由人保留的思考`,"{n} stage of {total} has thinking in it that a person keeps.":`{total} 个环节中，有 {n} 个含有需要由人保留的思考。`,"{n} stages of {total} have thinking in them that a person keeps.":`{total} 个环节中，有 {n} 个含有需要由人保留的思考。`,"It leans most on {list}.":`它最依赖{list}。`,"{name} ({n} stage)":`{name}（{n} 个环节）`,"{name} ({n} stages)":`{name}（{n} 个环节）`,"Stages to split in two":`需要一分为二的环节`,"No stage mixes thinking with production.":`没有哪个环节把思考与制作混在一起。`,"{n} stage combines thinking with production. The person keeps the thinking; AI helps with a defined part.":`{n} 个环节把思考与制作结合在一起。思考由人保留，AI 协助完成其中界定清楚的一部分。`,"{n} stages combine thinking with production. The person keeps the thinking; AI helps with a defined part.":`{n} 个环节把思考与制作结合在一起。思考由人保留，AI 协助完成其中界定清楚的一部分。`,"Procedures AI can run":`AI 可以执行的程序`,"Every stage here needs a person’s thinking, so none is handed over as a fixed procedure.":`这里的每个环节都需要人的思考，因此没有任何一个环节可以作为固定程序交出去。`,"{n} stage is fixed procedures on approved inputs, always checked by a person.":`{n} 个环节是对已批准的输入执行的固定程序，并始终由人核查。`,"{n} stages are fixed procedures on approved inputs, always checked by a person.":`{n} 个环节是对已批准的输入执行的固定程序，并始终由人核查。`,"Required dimensions by stage, scrolls sideways on a small screen":`各环节所需的维度，在小屏幕上可左右滚动`,"Required dimensions by task stage":`各任务环节所需的维度`,Stage:`环节`,Allocation:`分配`,Required:`需要`,"Not identified":`未识别`,"Stages that need it":`需要该维度的环节数`,"Open a stage to inspect its operation and responsibilities. Edit its description to refine the allocation.":`打开某个环节，可查看其操作与职责分工。编辑它的描述，可调整分配结果。`,"How your request was understood":`我们如何理解你的请求`,"Read as {kind} about {subject}.":`理解为{kind}，主题是{subject}。`,"Read as {kind}.":`理解为{kind}。`,"You wrote: “{text}”.":`你的原话：“{text}”。`,"Signals found: {list}.":`识别到的依据：{list}。`,"Assumed, because the request did not say:":`由于请求中没有说明，因此作了以下假设：`,"How this prototype assesses a task":`这个原型如何评估一项任务`,"Stage descriptions first match explicit action rules, then related titles and paraphrases. Common spelling errors are also checked. A similar match is labelled in the operation details. Matching operations supply the six dimension requirements. Combined actions combine those requirements. Unmatched actions remain unspecified. A recognised operation can still need clarification before allocation, particularly when procedural rules or approved inputs are missing. This is a rule-based prototype, not a general language model; it may miss unfamiliar wording. Example maps and maps made on Create retain their authored assessments until a stage description is edited. Renaming a label does not change the description being assessed.":`环节的描述会先与明确的动作规则匹配，再与相近的标题和同义表述匹配，同时也会检查常见的拼写错误。若为相近匹配，会在操作详情中注明。匹配到的操作会给出六个维度的要求；组合动作则合并这些要求；无法匹配的动作保持为未明确。即便识别出某项操作，在分配之前仍可能需要进一步澄清，尤其是在缺少程序性规则或已批准的输入时。这是一个基于规则的原型，并非通用的语言模型，可能无法识别不熟悉的措辞。示例地图和在“创建”页生成的地图会保留其原有的评估结果，直到某个环节的描述被编辑。重命名标签不会改变被评估的描述。`,"Before using AI, confirm permission, protect private information and verify that the chosen tool can perform the operation reliably. If these conditions fail, keep execution with a person or suitable conventional software.":`使用 AI 之前，请确认已获得许可、保护好私人信息，并核实所选工具能够可靠地执行该操作。如果这些条件不成立，请将执行交由人或合适的常规软件来完成。`,"Operation assessed":`评估的操作`,"Stage of the project":`所属项目阶段`,"Why it is here":`为什么需要它`,Order:`顺序`,"Human contribution":`人的贡献`,"AI contribution":`AI 的贡献`,"Check before use":`使用前的核查`,"Delegation remains conditional on permission and reliable performance by the chosen tool.":`能否交由 AI 完成，仍取决于是否获得许可，以及所选工具能否可靠地完成。`,"A person approves the result of this stage before it counts as done.":`在此环节的结果被视为完成之前，须由人批准。`,Earlier:`提前`,Later:`推后`,"Edit description":`编辑描述`,"Rename stage":`重命名环节`,"Describe the stage to see its allocation.":`描述该环节，即可查看其分配结果。`,"Unspecified stage":`未明确的环节`,"Edit stage":`编辑环节`,"Add a stage":`添加环节`,"Describe the work":`描述这项工作`,"What happens in this stage?":`这个环节里要做什么？`,"e.g. Sort customer responses by date":`例如：按日期整理客户的回复`,"Include any rules or decisions already established.":`请写明已经确定的规则或决定。`,"Update stage":`更新环节`,Rename:`重命名`,"Stage name":`环节名称`,"Task name":`任务名称`,Name:`名称`,"The name is a label. To change the assessed work, edit its description.":`名称只是一个标签。如需改变被评估的工作，请编辑它的描述。`,"Save name":`保存名称`,"New task map":`新建任务地图`,"Describe your stages":`描述你的各个环节`,"Use up to {max} stages, each under {limit} characters.":`最多使用 {max} 个环节，每个环节不超过 {limit} 个字符。`,"Prepare a project proposal":`准备一份项目提案`,"Stages · one per line":`环节 · 每行一个`,"Define the project goal\nFind sources about the problem\nChoose a recommendation\nDraft the proposal\nFormat approved content using the agreed template":`确定项目目标

work stage by stage and asks which way each one leans.":`一项任务可以同时包含两者，而在大多数工作中，它们是交织在一起的。框架会逐个环节地审视这项工作，并判断每个环节更偏向哪一边。`,C:`概`,P:`程`,Conceptual:`概念性`,"Setting a purpose, developing an idea, interpreting evidence and making judgements.":`确立目的、发展构想、解读证据并作出判断。`,"The human contribution to retain.":`应当由人保留的贡献。`,Procedural:`程序性`,"Applying defined rules, formatting approved content and carrying out repeated operations.":`套用既定规则、排版已批准的内容，以及执行重复性的操作。`,"The component to consider delegating.":`可以考虑交出去的部分。`,"Project abstract":`项目摘要`,"What the project addresses":`项目要解决的问题`,"AI can produce an answer, an image or a draft while the person using it contributes little to the reasoning or creative process. When this becomes routine, work can be completed without the questioning, interpretation and judgement through which people develop and exercise their own thinking.":`AI 可以给出答案、图像或草稿，而使用它的人几乎没有参与推理或创作的过程。一旦这成为常态，工作就可能在缺少提问、解读和判断的情况下完成，而人正是通过这些过程来发展和运用自己的思考。`,"Human X AI addresses this problem by distinguishing conceptual and procedural work. Its goal is to identify the thinking a person should retain, then determine which supporting operations can be allocated to AI. Each stage is assessed by the thinking and procedures it requires.":`Human X AI 通过区分概念性工作与程序性工作来应对这一问题。它的目标是找出人应当保留的思考，再确定哪些辅助性操作可以交给 AI。每个环节都会依据其所需的思考与程序来评估。`,"Six dimensions (Purpose, Creativity, Reasoning, Judgement, Context and Execution) make that assessment explicit. Each stage receives an explained allocation: human-led conceptual work, human work with AI assistance, or AI execution within defined instructions. The result is a map of responsibilities, with the human contribution stated concretely.":`六个维度（目的、创造性、推理、判断、情境与执行）让这种评估变得清晰明确。每个环节都会得到一个附有解释的分配结果：由人主导的概念性工作、人在 AI 辅助下完成的工作，或在明确指令范围内由 AI 执行的工作。最终得到的是一张职责地图，其中具体写明了人的贡献。`,"Example task":`示例任务`,"Who leads each stage":`每个环节由谁主导`,Illustration:`插画`,Feedback:`反馈`,Proposal:`提案`,"Open this task map":`打开这张任务地图`,"Project goals":`项目目标`,"Retain independent thinking":`保留独立思考`,"Make the conceptual contribution visible before it disappears into an automated workflow.":`在概念性的贡献消失在自动化流程之前，让它清晰可见。`,"Define a useful role for AI":`为 AI 界定有益的角色`,"Allocate procedural work after the direction, content and checks are established.":`在方向、内容和核查方式确定之后，再分配程序性工作。`,"Explain each allocation":`解释每一项分配`,"Show which demands determine a stage’s place in the work and how mixed stages can be separated.":`说明哪些要求决定了一个环节在工作中的位置，以及如何把混合的环节拆分开来。`,"Make a Task Map":`生成任务地图`,"Make a Task Map for your own task":`为你自己的任务生成一张任务地图`,"Describe the task. The map lists its stages, who leads each one, and why.":`描述你的任务。地图会列出它的各个环节、每个环节由谁主导，以及原因。`,"The framework":`框架`,"Six dimensions for assessing work":`评估工作的六个维度`,"A stage of work is described by the dimensions it depends on. Each dimension leans towards thinking or towards procedure, and the blend decides who leads.":`一个工作环节可以用它所依赖的维度来描述。每个维度或偏向思考，或偏向程序，二者的混合比例决定由谁主导。`,"Framework dimensions":`框架的维度`,"Leans heavily towards thinking":`明显偏向思考`,"Leans towards thinking":`偏向思考`,"Sits between thinking and procedure":`介于思考与程序之间`,"Leans towards procedure":`偏向程序`,Thinking:`思考`,Procedure:`程序`,"How the allocation is decided":`分配如何决定`,"The dimensions of a stage blend to different degrees. Where the blend sits decides who leads the stage.":`一个环节的各个维度以不同程度混合在一起，混合比例落在何处，决定由谁主导该环节。`,"Mostly thinking":`以思考为主`,"The stage is mostly about a goal, an idea, an interpretation or a decision. The person performs that work; AI may supply supporting material.":`该环节主要涉及目标、构想、解读或决定。这部分工作由人来完成；AI 可以提供辅助材料。`,"Thinking and production together":`思考与制作交织`,"Choices and production happen at the same time and cannot be pulled cleanly apart. The person retains the thinking and leads; AI assists with a defined portion of production.":`选择与制作同时发生，无法干净地拆开。思考由人保留并由人主导；AI 协助完成其中界定清楚的一部分制作。`,"Mostly procedure":`以程序为主`,"Goals, inputs and instructions are fixed, and nothing in the stage leans on thinking. AI or ordinary software may execute the operation, while a person checks it.":`目标、输入与指令都已固定，环节中没有任何部分依赖思考。AI 或普通软件可以执行该操作，并由人核查。`,"Conceptual work gives a task its direction and meaning: defining a purpose, developing ideas, interpreting evidence and making decisions. Procedural work carries out specified operations, such as formatting approved content, sorting records or applying an agreed formula. Separating these components identifies the thinking a person should retain and the procedures that AI can perform.":`概念性工作赋予任务方向和意义：确立目的、发展构想、解读证据以及作出决定。程序性工作则执行具体规定的操作，例如排版已批准的内容、整理记录或套用约定的公式。把这两部分分开，就能识别出人应当保留的思考，以及 AI 可以执行的程序。`,"Dimensions are not split into two groups":`维度并不分成两组`,"No dimension is purely conceptual or purely procedural. Creativity leans heavily towards thinking and Execution leans towards procedure, but each carries some of the other: even a fixed procedure takes some understanding to set up and check, and even an idea takes craft to express. The framework therefore looks at how the dimensions of a stage blend, instead of sorting them into two groups.":`没有哪个维度是纯粹概念性的，也没有哪个维度是纯粹程序性的。创造性明显偏向思考，执行偏向程序，但每个维度都带有一点另一方的成分：即使是固定的程序，也需要一定的理解才能建立和核查；即使是一个构想，也需要手艺才能表达出来。因此，框架关注的是一个环节中各维度如何混合，而不是把它们归入两组。`,"Where the boundary changes":`界线在何处改变`,"Sorting a spreadsheet by a specified date column is execution. Deciding which records deserve priority involves judgement. Likewise, applying a supplied formula is execution; choosing a model and interpreting its results involves reasoning. Broad stages should be divided wherever those demands differ.":`按指定的日期列对电子表格排序属于执行；决定哪些记录应当优先，则涉及判断。同样，套用现成的公式属于执行；选择模型并解读其结果，则涉及推理。凡是这些要求有所不同的地方，都应当把较宽泛的环节拆分开来。`,"A proposed design principle":`一项设计原则的提议`,"This framework deliberately reserves conceptual responsibility for people. It does not claim that AI cannot produce ideas or arguments. The purpose is to preserve human participation in the thinking that gives work direction and meaning. The dimensions and allocation rules are a project proposal whose usefulness still requires evaluation.":`该框架有意把概念性的责任留给人。它并不声称 AI 无法提出想法或论证。其目的在于，让人继续参与那些赋予工作方向和意义的思考。这些维度和分配规则是一项项目提议，其价值仍有待评估。`,"Permission, privacy, tool reliability and the consequences of errors remain conditions of actual use. A classification as execution is not permission to use any tool with any information.":`许可、隐私、工具的可靠性以及出错的后果，仍然是实际使用的前提条件。被归为“执行”，并不意味着可以用任何工具处理任何信息。`,"Kinds of work":`工作类型`,"Each stage in a task map is one of these kinds of work. Open one to see what the person does, what AI may do, and how the result is checked.":`任务地图中的每个环节都属于下列某一类工作。展开其中一项，可以查看人做什么、AI 可以做什么，以及如何核查结果。`,"Meaning, reasoning or a decision. The person keeps it.":`涉及意义、推理或决定。由人保留。`,"Thinking and production together. Separate the two.":`思考与制作交织，应将两者分开。`,"A fixed procedure on approved inputs. A person checks.":`对已批准的输入执行的固定程序，由人核查。`,"When it applies":`适用情形`,"The person":`人`,AI:`AI`,"How it is checked":`如何核查`,"Worked examples":`示例解析`,"Example task maps":`示例任务地图`,"Each model shows where the thinking sits and where the procedure sits in the same piece of work.":`每个模型都展示了在同一项工作中，思考位于何处、程序位于何处。`,"{n} stages: {list}":`{n} 个环节：{list}`,"{n} stage":`{n} 个环节`,"{n} stages":`{n} 个环节`,Explore:`查看`,"Explore: {title}":`查看：{title}`,"Your own task":`你自己的任务`,"Have a task of your own?":`有自己的任务吗？`,"Write the stages yourself and the framework assesses each one.":`自己写下各个环节，框架会逐一评估。`,"Research and purpose":`研究与宗旨`,"The problem and the research behind it":`问题及其背后的研究`,"The problem we address":`我们要解决的问题`,"When a generated output replaces the reasoning, interpretation or creative activity behind a task, a person can finish the work without participating in its conceptual development. The concern is this displacement of human thinking, including the opportunities to exercise judgement and develop understanding.":`当生成的结果取代了任务背后的推理、解读或创造性活动时，人可以在不参与其概念发展的情况下完成工作。令人担忧的正是这种对人类思考的取代，其中也包括失去运用判断力、发展理解力的机会。`,"Human X AI takes the position that people should retain responsibility for the purpose, meaning and reasoning in their work. AI assistance is most useful when its role is specified around that contribution. The conceptual–procedural distinction makes those responsibilities visible.":`Human X AI 主张，人应当对自己工作中的目的、意义和推理保持责任。当 AI 的作用围绕这一贡献来明确规定时，AI 的辅助最为有用。概念性与程序性的区分，使这些责任变得清晰可见。`,"From research to design":`从研究到设计`,"The studies below examine learning, critical thinking, creativity and performance under different forms of AI assistance. They inform the problem definition. Our six dimensions are a proposed synthesis for allocating work; the research does not validate this particular classification or establish that all AI use reduces thinking ability.":`下列研究考察了在不同形式的 AI 辅助下，学习、批判性思维、创造力与工作表现的变化。它们为问题的界定提供了依据。我们提出的六个维度，是对工作分配的一种综合性设想；这些研究并未验证这一特定的分类方式，也没有证明所有的 AI 使用都会削弱思考能力。`,"(opens in a new tab)":`（在新标签页中打开）`,"How the framework will be evaluated":`如何评估这一框架`,"Evaluation will test whether people can identify the conceptual demands of an unfamiliar task, separate a mixed stage into human and AI contributions, and explain how a change in the operation changes its allocation. Comparing those explanations before and after using the framework will help assess whether it improves understanding. Educational effectiveness has not yet been established.":`评估将检验：人们能否识别一项陌生任务中的概念性要求，能否把混合的环节拆分为人与 AI 各自的贡献，以及能否解释操作的变化如何改变其分配结果。对比使用框架前后的这些解释，有助于判断它是否提升了理解。其教育成效尚未得到证实。`,"Saved work":`已保存的作品`,"Your task maps":`你的任务地图`,"Stored in this browser. Save a backup to keep a copy elsewhere.":`保存在这个浏览器中。可保存备份文件，在其他地方留存一份副本。`,"Saved task maps":`已保存的任务地图`,"Made on Create":`在“创建”页生成`,"From an example":`来自示例`,"Your own stages":`你自己写的环节`,"Delete {title}?":`要删除“{title}”吗？`,"Delete for good":`永久删除`,Keep:`保留`,"Open {title}":`打开“{title}”`,Open:`打开`,"Delete {title}":`删除“{title}”`,Delete:`删除`,"No saved maps yet. {create} or {examples}.":`还没有已保存的地图。你可以{create}，或者{examples}。`,"start from an example":`从示例开始`,Backup:`备份`,"Keep a copy":`留存副本`,"Save a backup file":`保存备份文件`,"Restore from a backup file":`从备份文件恢复`,"Backup as text":`以文本形式备份`,"If a file will not download or open here, copy this text and keep it somewhere safe.":`如果文件无法在这里下载或打开，请复制这段文本，并妥善保存。`,"Your backup":`你的备份`,"To restore, paste a backup here":`如需恢复，请在这里粘贴备份内容`,"Restore from pasted text":`从粘贴的文本恢复`,"An earlier questionnaire draft is also preserved.":`早期的问卷草稿也已保留。`,"Export earlier draft":`导出早期草稿`,"Earlier evaluations ({n})":`早期的评估（{n}）`,"Earlier questionnaire results use a different framework. They remain available for export and have not been converted into new assessments.":`早期的问卷结果使用的是另一套框架。它们仍可导出，但尚未转换为新的评估。`,"Earlier evaluation":`早期评估`,"Export original data":`导出原始数据`},Kt=[`frame`,`gather`,`shape`,`make`,`check`,`deliver`],R={written:{frame:{name:`Understand the brief`,purpose:`Decide what the piece must do and for whom.`},gather:{name:`Research and sources`,purpose:`Find what the writing will rest on.`},shape:{name:`Argument and structure`,purpose:`Decide what is being said and in what order.`},make:{name:`Writing`,purpose:`Turn the structure into text.`},check:{name:`Revision`,purpose:`Make the text say what you mean, correctly.`},deliver:{name:`Submission`,purpose:`Confirm it is ready and hand it in.`}},software:{frame:{name:`Scope the product`,purpose:`Decide what it must do and what the first version leaves out.`},gather:{name:`References and options`,purpose:`Look at what exists and what could be used.`},shape:{name:`Design`,purpose:`Decide how it looks, works and is structured.`},make:{name:`Build`,purpose:`Create the working parts.`},check:{name:`Test and fix`,purpose:`Find what is broken and decide what to fix.`},deliver:{name:`Release`,purpose:`Package it and confirm it is ready to share.`}},visual:{frame:{name:`Creative brief`,purpose:`Decide the purpose, audience and feel.`},gather:{name:`References and material`,purpose:`Collect inspiration and source material.`},shape:{name:`Concept and direction`,purpose:`Choose the idea and the direction to take.`},make:{name:`Production`,purpose:`Make the first full version.`},check:{name:`Review and po .53761/q3azde36`}],H={"https://doi.org/10.1073/pnas.2422633122":{title:`没有工具时的学习`,meta:`Bastani 等 · PNAS · 2025`,summary:`在一项高中数学实验中，标准版 GPT 的辅助提高了练习阶段的表现，但在撤去 AI 后，学生的表现反而较弱。相关的防护措施在很大程度上缓解了这一不利影响。`},"https://doi.org/10.1145/3706598.3713778":{title:`工作中的批判性思维`,meta:`Lee 等 · CHI · 2025`,summary:`一项针对 319 名知识工作者的调查发现，对 AI 越有信心，自述的批判性思维越少。自我报告的证据并不能说明技能会永久丧失。`},"https://doi.org/10.1126/sciadv.adn5290":{title:`创造力与多样性`,meta:`Doshi 与 Hauser · Science Advances · 2024`,summary:`AI 生成的构思提高了短篇故事的评分，同时使故事彼此更加相似。该研究针对的是一项特定的写作任务。`},"https://doi.org/10.1093/qje/qjae044":{title:`职场中的益处`,meta:`Brynjolfsson 等 · Quarterly Journal of Economics · 2025`,summary:`一项涵盖 5,172 名客服人员的研究发现，每小时解决的问题数平均增加 15%，并且有学习效应的证据。该结果只反映了一种职业环境。`},"https://doi.org/10.1038/s41562-024-02024-1":{title:`协作何时有益`,meta:`Vaccaro 等 · Nature Human Behaviour · 2024`,summary:`在 106 项实验中，人类与 AI 的组合平均而言并未超过两者中表现较好的一方单独完成的水平。人机协作需要经过审慎的设计。`},"https://doi.org/10.53761/q3azde36":{title:`现有的评估框架`,meta:`Perkins 等 · JUTLP · 2024`,summary:`AI 评估量表（AI Assessment Scale）将 AI 的参与程度与教育成果联系起来。我们的原型则侧重于在一项任务之内给出有解释的分配。`}},ra=(e,t)=>{let n=t===`zh`?H[e.url]:void 0;return n?{...e,...n}:e},ia=`When a generated output replaces the reasoning, interpretation or creative activity behind a task, a person can finish the work without participating in its conceptual development. The concern is this displacement of human thinking, including the opportunities to exercise judgement and develop understanding.`,aa=`Human X AI takes the position that people should retain responsibility for the purpose, meaning and reasoning in their work. AI assistance is most useful when its role is specified around that contribution. The conceptual–procedural distinction makes those responsibilities visible.`,oa=`The studies below examine learning, critical thinking, creativity and performance under different forms of AI assistance. They inform the problem definition. Our six dimensions are a proposed synthesis for allocating work; the research does not validat
